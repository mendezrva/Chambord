# Fly.io config: one always-on small machine with a 1 GB volume for the SQLite file.
# Change `app` to a name of your own (it becomes https://<app>.fly.dev) and pick the region
# nearest you (fly platform regions), then: fly launch --copy-config --no-deploy, fly volumes create data --size 1, fly deploy.
app = "glockenfels"
primary_region = "sjc"

[build]

[env]
  PORT = "8080"
  DATA_DIR = "/data"

[[mounts]]
  source = "data"
  destination = "/data"

[http_service]
  internal_port = 8080
  force_https = true
  # Keep one machine running: games live in memory between moves and sockets must stay open.
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    grace_period = "10s"
    interval = "30s"
    method = "GET"
    path = "/health"
    timeout = "5s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
